[general]
version = 4
name = Creality Ender-3 Pro_settings
definition = creality_ender3pro

[metadata]
type = definition_changes
setting_version = 27

[values]
extruders_enabled_count = 1
machine_start_gcode = ; Ender 3 Custom Start G-code
	G92 E0 ; Reset Extruder
	G28 ; Home all axes
	G92 Z0.35 ; COLD GAP IS 0.15mm. 0.15 of this is the honest gap; the extra 0.20 is a DELIBERATE NOZZLE DROP added 2026-07-30 after three adhesion failures at an honest G92. A commanded 0.30 first layer therefore prints at a real 0.10mm gap. If the first layer plows or the base flares, reduce toward 0.25 - do not raise further
	G1 Z5.0 F3000 ; Move Z Axis up a bit during heating to not damage bed
	M104 S{material_standby_temperature} ; Start heating up the nozzle most of the way
	M190 S{material_bed_temperature_layer_0} ; Start heating the bed, wait until target temperature reached
	M109 S{material_print_temperature_layer_0} ; Finish heating the nozzle
	G1 Z2.0 F3000 ; Move Z Axis up little to prevent scratching of Heat Bed
	G1 X6.1 Y20 Z0.3 F5000.0 ; Move to start position
	G1 X6.1 Y200.0 Z0.3 F1500.0 E15 ; Draw the first line
	G1 X6.4 Y200.0 Z0.3 F5000.0 ; Move to side a little
	G1 X6.4 Y20 Z0.3 F1500.0 E30 ; Draw the second line
	G92 E0 ; Reset Extruder
	G1 Z2.0 F3000 ; Move Z Axis up little to prevent scratching of Heat Bed
	G1 X5 Y20 Z0.3 F5000.0 ; Move over to prevent blob squish

